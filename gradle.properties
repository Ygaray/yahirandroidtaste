org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Required for KSP 2.3.x with AGP 9.x built-in Kotlin (KSP adds Kotlin sources) — carried over
# verbatim from SecondBrain, where the module compiles with only the kotlin.compose plugin (no
# explicit kotlin.android). Removing this breaks the KSP/Hilt source-gen step.
android.disallowKotlinSourceSets=false
