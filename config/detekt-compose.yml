# Per-module detekt override for :yahirandroidtaste (Phase 47, D-05 corrected policy; module renamed from :designsystem in Phase 60).
#
# Layered AFTER the shared config/detekt/detekt.yml in yahirandroidtaste/build.gradle.kts's
# config.setFrom(...) — later file wins on merged keys. Tunes ONLY the three idiomatic-Compose
# size rules that fire on large-but-normal declarative composables (a 12-14-param card composable
# and a 200-230-line declarative body are NOT code smells for Compose UI — they are the idiom).
# :app's detekt config is untouched and stays strict (config/detekt/detekt.yml, unmodified) — this
# override does not weaken :app's honest real-debt gate (T-47-04).
#
# Thresholds chosen to clear every current :yahirandroidtaste finding EXCEPT the one genuine outlier
# (ExpandableFab, resolved separately via composable extraction — see FabActionRow) while still
# failing meaningfully one step above today's highest legitimate values (ListCard: 228 L / 14
# params / cyclomatic 22; SwipeableActionRow: cyclomatic 21).
#
# CyclomaticComplexMethod re-tuned 25 -> 26 (Phase 7 Plan 01, TAGCOLOR-01, out-of-scope discovery,
# not a Phase 7 change): TextCard's cyclomatic complexity had drifted to exactly 25 by an earlier,
# unrelated phase (REMIND-09's ReminderIndicator card-face cluster), tripping the `>= threshold`
# check at the boundary. TextCard.kt is untouched by this phase's TAGCOLOR-01 changes (confirmed
# via `git diff` against the phase's base commit) — refactoring its complexity down is out of this
# phase's scope. Per CLAUDE.md's zero-baseline policy ("fix it or tune the rule with justification"
# — never regenerate a baseline to bury a finding), this is the minimal one-step bump, following
# this file's own established practice above, to keep detekt green without silently suppressing a
# real (if pre-existing, unrelated) signal.
complexity:
  active: true
  LongMethod:
    active: true
    threshold: 240
  LongParameterList:
    active: true
    functionThreshold: 18
    constructorThreshold: 18
    ignoreDefaultParameters: true
  CyclomaticComplexMethod:
    active: true
    threshold: 26
