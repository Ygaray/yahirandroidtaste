# detekt configuration for SecondBrain (Phase 37 — permanent lightweight gate)
# Version: detekt 1.23.8, syntax-only mode (no type-resolution classpath)
# Kotlin 2.2.10 compatibility: syntax-only avoids the embedded 2.0.21 parser risk
#
# Rules enabled (~10 targeted rules):
#   complexity: LongMethod, LongParameterList, CyclomaticComplexMethod (formerly ComplexMethod)
#   naming: FunctionNaming, ClassNaming, VariableNaming, ObjectPropertyNaming, PackageNaming
#   style: UnusedPrivateMember  (moved to style in detekt 1.23.x — not in potential-bugs)
# All other rulesets disabled to keep signal-to-noise high.
# Note: `formatting` ruleset requires the separate detekt-formatting artifact and is omitted.
#
# Naming exclusions (Phase 38 D38-04, WR-02/WR-03):
#   FunctionNaming.ignoreAnnotated: ['Composable'] — Jetpack Compose composable functions use
#     PascalCase by convention which conflicts with FunctionNaming's camelCase expectation.
#   FunctionNaming / VariableNaming excludes: test sources excluded because JUnit test methods
#     use underscored snake_case idioms (e.g. `fun someMethod_state_returnsX()`) and test-local
#     variable names follow Arrange-Act-Assert conventions; enforcing naming rules there adds
#     noise without improving production code quality.

build:
  # The residual entries in detekt-baseline.xml are justified/documented per DETEKT-01
  # (97-RESEARCH.md, Phase 97 Plan 01) — see the baseline file's own header comment.
  maxIssues: 0

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 6
    ignoreDefaultParameters: true
  CyclomaticComplexMethod:
    active: true
    threshold: 15

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
    excludes: ['**/test/**', '**/androidTest/**', '**/*Test.kt']
  ClassNaming:
    active: true
  VariableNaming:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/*Test.kt']
  ObjectPropertyNaming:
    active: true
  PackageNaming:
    active: true

style:
  active: true
  UnusedPrivateMember:
    active: true

# Disable all other rulesets (keep signal-to-noise high for the audit gate)
comments:
  active: false
coroutines:
  active: false
empty-blocks:
  active: false
exceptions:
  active: false
performance:
  active: false
potential-bugs:
  active: false
