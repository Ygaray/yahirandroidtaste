# Self-contained fork of SecondBrain's exact version pins for the moved :yahirandroidtaste module
# (LIB-01). Deliberately AGP 9.2.1 / Gradle 9.4.1 / kotlin.compose — diverging from the older
# backup-engine/drive-auth 8.13 sibling-hub pins, since the module's build file uses AGP-9-only DSL
# (compileSdk { version = release(36) { minorApiLevel = 1 } }). Do NOT re-derive versions from the
# siblings — forking SB's catalog verbatim is the #1 drift-avoidance measure (research).
[versions]
agp = "9.2.1"
kotlin = "2.3.20"
ksp = "2.3.9"
hilt = "2.60.1"
detekt = "1.23.8"
composeBom = "2026.04.01"
activityCompose = "1.8.0"
navigationCompose = "2.9.8"
reorderable = "3.1.0"
coil = "3.0.4"
coroutinesTest = "1.11.0"
junit = "4.13.2"
robolectric = "4.16.1"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
reorderable = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
metalava = { id = "me.tylerbwong.gradle.metalava", version = "0.5.0" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
